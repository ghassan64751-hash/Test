<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تسجيل الدخول</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="card">
  <h1>تسجيل الدخول</h1>

  <form id="emailForm" novalidate>
    <p class="hint">أدخل بريدك الإلكتروني وسنرسل لك رمز تحقق من 6 أرقام.</p>
    <label for="email">البريد الإلكتروني</label>
    <input id="email" type="email" inputmode="email" autocomplete="email" placeholder="name@example.com" dir="ltr" required>
    <button type="submit" id="sendBtn">إرسال الرمز</button>
  </form>

  <form id="codeForm" novalidate hidden>
    <p class="hint">أرسلنا رمزاً إلى <b id="sentTo" dir="ltr"></b></p>
    <label for="code">رمز التحقق</label>
    <input id="code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000" dir="ltr" class="code" required>
    <button type="submit" id="verifyBtn">تأكيد ودخول</button>
    <div class="row">
      <button type="button" class="link" id="resendBtn" disabled>إعادة الإرسال</button>
      <button type="button" class="link" id="changeBtn">تغيير البريد</button>
    </div>
  </form>

  <p id="msg" class="msg" role="alert" aria-live="polite"></p>
</main>
<script src="app.js"></script>
</body>
</html>
